name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
      # Unit tests only: fuzz/invariant gas averages vary per run.
      - run: forge snapshot --match-test "^test_" --check --tolerance 10

  slither:
    name: slither (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: crytic/slither-action@v0.4.1
        id: slither
        with:
          target: contracts/
          slither-args: --filter-paths "lib/|test/|script/" --exclude-dependencies
          fail-on: none
          sarif: slither.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither.sarif

  web:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vouch/abi build && pnpm --filter @vouch/shared build && pnpm --filter @vouch/mcp build
      - run: pnpm -r typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm -r lint
      - run: pnpm -r test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JOB_SECRETS_KEY: "0xabababababababababababababababababababababababababababababababab"
      - run: pnpm --filter @vouch/web build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JOB_SECRETS_KEY: "0xabababababababababababababababababababababababababababababababab"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
