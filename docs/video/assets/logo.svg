<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-label="Kora Coffee logo">
  <title>Kora Coffee</title>
  <!-- Mark: a coffee bean split by a single curved line, in Roast Brown with a Crema highlight -->
  <g transform="translate(24 20)">
    <ellipse cx="60" cy="60" rx="44" ry="58" transform="rotate(-24 60 60)" fill="#4A2C1D"/>
    <path d="M44 16 C 76 44, 44 76, 76 104" fill="none" stroke="#F3E6D3" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="160" y="100" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="700" letter-spacing="6" fill="#4A2C1D">KORA</text>
  <text x="164" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="9" fill="#C8773B">COFFEE</text>
</svg>
